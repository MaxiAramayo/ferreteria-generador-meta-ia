packages:
  - apps/*
  - infrastructure/database
  - packages/*

catalogMode: strict

catalog:
  "@eslint/js": 10.0.1
  "@fontsource/archivo": 5.2.8
  "@fontsource/saira-condensed": 5.2.8
  "@nestjs/common": 11.1.28
  "@nestjs/core": 11.1.28
  "@nestjs/platform-express": 11.1.28
  "@nestjs/testing": 11.1.28
  "@next/eslint-plugin-next": 16.2.11
  "@prisma/adapter-pg": 7.9.0
  "@prisma/client": 7.9.0
  "@types/node": 24.13.3
  "@types/pg": 8.20.0
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  eslint: 10.7.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.7.0
  lucide-react: 0.561.0
  next: 16.2.11
  pg: 8.22.0
  playwright-core: 1.62.0
  prettier: 3.9.6
  prisma: 7.9.0
  react: 19.2.8
  react-dom: 19.2.8
  redis: 6.1.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  typescript: 5.9.3
  typescript-eslint: 8.65.0

# La instalación no ejecuta scripts de terceros. Sharp distribuye binarios
# precompilados y Prisma genera su cliente de forma explícita durante build, por
# lo que sus scripts de instalación permanecen bloqueados.
allowBuilds:
  "@prisma/engines": false
  prisma: false
  sharp: false
